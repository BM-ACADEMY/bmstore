# Local dev dependencies for your laptop:  docker compose up -d
# (The API itself runs with `npm run start:dev -w apps/api`.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bmstore
      POSTGRES_PASSWORD: bmstore
      POSTGRES_DB: bmstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmstore -d bmstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local object storage (S3-compatible). Production: R2 or S3 via the same S3_* env vars.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: bmstore
      RUSTFS_SECRET_KEY: bmstore-minio
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"   # S3 API  -> S3_ENDPOINT=http://localhost:9000
      - "9001:9001"   # web console
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates the bucket once and makes it publicly readable (images are served straight from it).
  rustfs-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: bmstore
      AWS_SECRET_ACCESS_KEY: bmstore-minio
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        EP=http://rustfs:9000
        aws --endpoint-url $$EP s3api head-bucket --bucket bmstore 2>/dev/null || aws --endpoint-url $$EP s3api create-bucket --bucket bmstore
        aws --endpoint-url $$EP s3api put-bucket-policy --bucket bmstore --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::bmstore/*"]}]}'

volumes:
  pgdata:
  rustfsdata:
